<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload Document</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        .help {
            color: #666;
            margin-bottom: 20px;
        }

        .errorlist {
            color: #b00020;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .back {
            margin-right: 10px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Upload PDF</h1>

    <p class="help">
        Upload a PDF document.
        Maximum file size: 10 MB.
    </p>

    <form
        method="post"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Upload PDF
        </button>

    </form>

    <br>

    <a href="{% url 'documents:document_list' %}">
        Back to documents
    </a>

</div>

</body>

</html>
