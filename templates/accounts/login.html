{% extends "base/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<h1>Login</h1>

{% if form.errors %}
    <p>
        Invalid username or password.
        Please try again.
    </p>
{% endif %}

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <input type="hidden" name="next" value="{{ next }}">

    <button type="submit">
        Login
    </button>

</form>

<p>
    Don't have an account?
    <a href="{% url 'accounts:signup' %}">
        Create an account
    </a>
</p>

{% endblock %}
